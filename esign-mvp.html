<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>電子簽署 MVP</title>
<style>
:root{--paper:#fff;--ink:#1B2A41;--slate:#5C6B7F;--line:#E1E6EC;--wash:#F5F7F9;--seal:#B4262A;--seal-wash:#FBEDED;--pine:#1F7A55;--pine-wash:#E8F4EE;--amber:#9A6A00;--amber-wash:#FFF4D6;--r:10px}
*{box-sizing:border-box}html,body{margin:0;background:var(--wash);color:var(--ink);font:15px/1.55 -apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.app{max-width:480px;margin:0 auto;min-height:100dvh;background:var(--paper);display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:12px;min-height:52px}
.top .back{color:var(--slate);padding:6px 4px 6px 0}.top .title{flex:1;font-weight:600;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.top .step{font-size:13px;color:var(--slate)}
.strip{height:3px;background:var(--line)}.strip>i{display:block;height:100%;background:var(--ink);transition:width .3s}
.body{flex:1;padding:16px 16px 100px}
.bar{position:sticky;bottom:0;z-index:5;background:var(--paper);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:flex;gap:10px}.bar .note{flex:1;font-size:13px;color:var(--slate);align-self:center}
h1{font-size:22px;line-height:1.3;margin:6px 0 8px}h2{font-size:17px;margin:22px 0 10px;font-weight:600}p{margin:0 0 10px}.muted{color:var(--slate)}.small{font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 18px;border-radius:var(--r);font-weight:600;border:1px solid transparent}
.btn.primary{background:var(--ink);color:#fff}.btn.primary:disabled{background:#B9C2CE;cursor:not-allowed}.btn.red{background:var(--seal);color:#fff}.btn.red:disabled{background:#D9A5A6;cursor:not-allowed}
.btn.ghost{border-color:var(--line);background:var(--paper)}.btn.wide{flex:1}.link{color:var(--ink);text-decoration:underline;text-underline-offset:3px;font-size:13px}
.field{margin-bottom:16px}.field label{display:block;font-weight:600;margin-bottom:6px}.field .help{font-size:13px;color:var(--slate);margin-top:6px}.field .err{font-size:13px;color:var(--seal);margin-top:6px}
.input{width:100%;min-height:46px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--paper)}.input.bad{border-color:var(--seal)}textarea.input{min-height:72px}
.opt{display:flex;align-items:flex-start;gap:12px;padding:12px;border:1px solid var(--line);border-radius:var(--r);margin-bottom:8px;width:100%;text-align:left;background:var(--paper)}.opt.on{border-color:var(--ink);background:var(--wash)}
.box{width:22px;height:22px;flex:none;border:1.5px solid var(--slate);border-radius:5px;display:grid;place-items:center}.box.round{border-radius:50%}.opt.on .box{background:var(--ink);border-color:var(--ink);color:#fff}
.card{border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:12px}.card.wash{background:var(--wash);border-color:transparent}
.row{display:flex;justify-content:space-between;gap:12px;align-items:center}
.kv{display:grid;grid-template-columns:9.5em 1fr;gap:6px 12px;font-size:13px}.kv dt{color:var(--slate);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--wash);color:var(--slate)}.tag.done{background:var(--pine-wash);color:var(--pine)}.tag.now{background:var(--ink);color:#fff}
.banner{background:var(--seal-wash);color:var(--seal);border-radius:var(--r);padding:10px 14px;margin-bottom:14px;font-size:13px}.banner.info{background:var(--wash);color:var(--ink)}
.docitem{display:flex;gap:14px;align-items:center;width:100%;text-align:left;padding:14px 0;border-bottom:1px solid var(--line)}
.docitem .n{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:13px;color:var(--slate);flex:none}
.docitem.done .n{background:var(--pine);border-color:var(--pine);color:#fff}.docitem.next .n{border-color:var(--ink);color:var(--ink);font-weight:700}
.docitem .t{flex:1}.docitem .t b{display:block;font-weight:600}.docitem .t span{font-size:13px;color:var(--slate)}
.progress{display:flex;align-items:baseline;gap:8px;margin:14px 0 4px}.progress b{font-size:34px;line-height:1}
.chk{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:12px 0;border-bottom:1px solid var(--line)}
.chk .mark{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--slate);display:grid;place-items:center;flex:none;font-size:13px}.chk.done .mark{background:var(--pine);border-color:var(--pine);color:#fff}.chk.warn .mark{border-color:var(--amber);color:var(--amber)}
.chk .t{flex:1;min-width:0}.chk .t small{display:block;color:var(--slate);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chk .go{font-size:13px;text-decoration:underline;text-underline-offset:3px}
.tabs{display:flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:14px}.tabs button{flex:1;padding:10px;font-weight:600;color:var(--slate)}.tabs button.on{background:var(--ink);color:#fff}
.page{position:relative;margin:0 0 14px;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#fff}.page canvas{display:block;width:100%;height:auto}
.page .pn{position:absolute;right:8px;top:8px;font-size:11px;background:rgba(27,42,65,.85);color:#fff;padding:2px 7px;border-radius:999px}
.ov{position:absolute;display:flex;align-items:center;padding:0 2px;font-size:9px;line-height:1;border-radius:2px;overflow:hidden;white-space:nowrap;text-align:left;border:1px solid transparent;color:var(--ink)}
.ov.filled{background:rgba(31,122,85,.12);border-color:rgba(31,122,85,.55)}.ov.blocking{background:rgba(180,38,42,.1);border-color:var(--seal)}.ov.warn{background:rgba(154,106,0,.12);border-color:var(--amber)}
.ov.ro{background:rgba(92,107,127,.08);border-color:rgba(92,107,127,.35);color:var(--slate)}.ov.optional,.ov.sys{border-style:dashed;border-color:rgba(92,107,127,.5);color:var(--slate)}
.ov.check{justify-content:center;font-weight:700}.ov.sig{justify-content:center;font-size:10px;color:var(--seal);border-style:dashed;border-color:var(--seal)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--slate);margin:6px 0 14px}.legend i{display:inline-block;width:12px;height:12px;border-radius:2px;vertical-align:-2px;margin-right:4px}
.scrim{position:fixed;inset:0;background:rgba(27,42,65,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:480px;background:var(--paper);border-radius:16px 16px 0 0;padding:14px 16px calc(16px + env(safe-area-inset-bottom));max-height:88dvh;overflow:auto}.sheet .grip{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}.sheet h3{margin:0 0 4px}.sheet .actions{display:flex;gap:10px;margin-top:14px}
.pad{position:relative;border:1.5px dashed var(--slate);border-radius:var(--r);background:#fff;height:200px;touch-action:none}.pad canvas{display:block;width:100%;height:100%}
.pad .base{position:absolute;left:24px;right:24px;bottom:44px;border-top:1px solid var(--line);pointer-events:none}.pad .hint{position:absolute;inset:0;display:grid;place-items:center;color:#B9C2CE;pointer-events:none;font-size:17px}.pad .clear{position:absolute;right:10px;top:8px;font-size:13px;color:var(--slate);text-decoration:underline}
.reuse{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;margin-bottom:14px}.reuse img{height:44px;width:120px;object-fit:contain;background:var(--wash);border-radius:6px}
.stamp-wrap{display:grid;place-items:center;margin:26px 0 18px}.stamp{width:118px;height:118px;border:3px solid var(--seal);border-radius:50%;display:grid;place-items:center;color:var(--seal);font-weight:700;font-size:26px;letter-spacing:.2em;transform:rotate(-8deg);position:relative;animation:stamp .35s cubic-bezier(.2,1.4,.4,1)}
.stamp::after{content:"";position:absolute;inset:6px;border:1px solid var(--seal);border-radius:50%;opacity:.6}@keyframes stamp{from{transform:rotate(-8deg) scale(1.6);opacity:0}to{transform:rotate(-8deg) scale(1);opacity:1}}
.hash{font-family:ui-monospace,Menlo,monospace;font-size:11px;word-break:break-all;color:var(--slate)}
.log{font-size:12px;border-bottom:1px solid var(--line);padding:8px 0;display:grid;grid-template-columns:118px 1fr;gap:8px}
.userbar{font-size:12px;color:var(--slate);padding:6px 16px;background:var(--wash);display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--line)}.userbar .sp{flex:1}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

function render() {
  const d = route.doc, tpl = d && tplOf(d);
  const screens = {S1, S2, S3, S4, S5, S7, S8, S9, SETTINGS, AUDIT};
  app.innerHTML = userbar() + (screens[route.name]||S1)(d, tpl) + (sheet ? sheetHtml() : '') + (toast ? `<div class="banner" style="position:fixed;left:16px;right:16px;bottom:90px;z-index:30;max-width:448px;margin:auto">${esc(toast)}</div>` : '');

const showToast = (m, ms=2500) => { toast = m; render(); setTimeout(()=>{ toast=null; render(); }, ms); };

/* S1 */

  return hdr('電子簽署') + `<div class="body"><p class="muted small">${esc(S.workflow.title)}</p><h1>${done===S.docs.length?'手續已全部完成':'今天要完成的簽署'}</h1>
  <div class="progress"><b>${done}</b><span class="muted">／ ${S.docs.length} 份完成</span></div><div class="strip" style="margin:4px 0 18px;border-radius:2px"><i style="width:${done/S.docs.length*100}%"></i></div>

/* S2 */
function S2(d, tpl) { return hdr(tpl.name, `第 ${S.docs.indexOf(d)+1} 份`, true, pct('S2')) + `<div class="body"><p class="muted small">版本 v${tpl.version}　· 共 ${tpl.totalPages} 頁　· 約 ${tpl.estimatedMinutes} 分鐘</p><h1>${esc(tpl.name)}</h1><p>${esc(tpl.description)}</p>

/* 欄位編輯器 */
function editor(f, v, err) {

  const inp = t => `<input class="input${bad}" type="${t}" data-f="${f.fieldId}" value="${esc(v??'')}" ${ml} ${f.type==='IDField'?'autocapitalize="characters" placeholder="A123456789"':''} ${f.type==='PhoneField'?'inputmode="numeric" placeholder="0912345678"':''}>`;
  const body = {TextField:()=>inp('text'), NumberField:()=>inp('number'), DateField:()=>inp('date'), TimeField:()=>inp('time'), PhoneField:()=>inp('tel'), IDField:()=>inp('text'),
    AddressField:()=>`<textarea class="input${bad}" data-f="${f.fieldId}" ${ml}>${esc(v??'')}</textarea>`, Textarea:()=>`<textarea class="input${bad}" data-f="${f.fieldId}" ${ml}>${esc(v??'')}</textarea>`,
    Select:()=>`<select class="input" data-f="${f.fieldId}"><option value="">請選擇</option>${f.options.map(o=>`<option ${o.value===v?'selected':''}>${esc(o.label)}</option>`).join('')}</select>`,
    Radio:()=>f.options.map(o=>`<button type="button" class="opt ${v===o.value?'on':''}" data-a="pick" data-f="${f.fieldId}" data-radio="${esc(o.value)}"><span class="box round">${v===o.value?'●':''}</span><span>${esc(o.label)}</span></button>`).join(''),
    CheckboxGroup:()=>f.options.map(o=>{const on=(v||[]).includes(o.value);return `<button type="button" class="opt ${on?'on':''}" data-a="pick" data-f="${f.fieldId}" data-cg="${esc(o.value)}"><span class="box">${on?'✓':''}</span><span>${esc(o.label)}</span></button>`;}).join(''),
    Checkbox:()=>`<button type="button" class="opt ${v?'on':''}" data-a="pick" data-f="${f.fieldId}" data-cb="1"><span class="box">${v?'✓':''}</span><span>${esc(f.label)}</span></button>`}[f.type];
  if (!body) return `<p class="muted small">此欄位類型（${f.type}）尚未支援</p>`;
  return `<div class="field">${f.type!=='Checkbox'?`<label>${esc(f.label)}${f.required?' <span style="color:var(--seal)">*</span>':''}</label>`:''}${body()}

}

/* S3 */

/* S4 合約檢核 */

  <div class="legend"><span><i style="background:rgba(31,122,85,.35)"></i>已帶入</span><span><i style="background:rgba(180,38,42,.35)"></i>待填</span><span><i style="background:rgba(154,106,0,.35)"></i>建議勾選</span><span><i style="background:rgba(92,107,127,.3)"></i>他人／系統填寫</span></div>
  <div id="pages">${Array.from({length:tpl.totalPages},(_,i)=>i+1).map(p=>`<div class="page" data-page="${p}"><canvas></canvas><span class="pn">${p} / ${tpl.totalPages}${viewed.has(p)?' ✓':''}</span>${overlays(p)}<div class="sentinel" data-page="${p}" style="position:absolute;bottom:0;left:0;right:0;height:24px"></div></div>`).join('')}</div>
  <p class="small muted">已檢核 ${viewed.size} / ${tpl.totalPages} 頁${viewed.size<tpl.totalPages?'，請捲動到每一頁結尾':''}　${cl.blocking.length+cl.nonBlocking.length?`· 待完成 ${cl.blocking.length+cl.nonBlocking.length} 項`:''}</p></div>
  <div class="bar"><span class="note">${route.note||''}</span><button class="btn primary" data-a="${reviewed?'go':'review'}" data-to="S5" ${viewed.size>=tpl.totalPages&&basicOk(d)?'':'disabled'}>${reviewed?'前往待完成清單':`確認已檢核全部 ${tpl.totalPages} 頁`}</button></div>`;
}
function afterS4(d, tpl) {
  const cont = $('#pages'); if (!cont) return;
  const io = new IntersectionObserver(es => { let ch=false; es.forEach(e=>{ if (e.isIntersecting) { route.viewed = route.viewed||new Set(); if (!route.viewed.has(+e.target.dataset.page)) { route.viewed.add(+e.target.dataset.page); ch=true; } } }); if (ch) { const y=window.scrollY; render(); window.scrollTo(0,y); } }, {threshold:1});
  cont.querySelectorAll('.sentinel').forEach(el=>io.observe(el));
  if (!route.rendered) renderPages(tpl, cont).then(()=>{ route.rendered = true; }).catch(e=>showToast('合約頁面渲染失敗：'+e.message));

/* S5 */

let padCanvas = null;

const pdfStore = {};   // 本次 Session 產出的 PDF bytes（重新整理後可用「重新產生」還原，內容相同）
/* S9 */
function S9(d, tpl) { return hdr('完成', null, false, 100) + `<div class="body"><div class="stamp-wrap"><div class="stamp" aria-hidden="true">已簽署</div></div><h1 style="text-align:center">${esc(tpl.name)}<br>簽署完成</h1>
  <div class="card" style="margin-top:20px"><dl class="kv"><dt>文件編號</dt><dd><b>${d.docNumber}</b></dd><dt>簽署時間</dt><dd>${d.signature.at.replace('T',' ').slice(0,19)}</dd><dt>簽章等級</dt><dd>Basic（手寫簽名 + Hash）</dd><dt>簽章雜湊</dt><dd class="hash">${d.signature.hash}</dd><dt>文件雜湊</dt><dd class="hash">${d.pdfHash}</dd></dl></div>
  <p class="small muted">PDF 已附簽署證據報告頁。文件雜湊可用來驗證檔案是否遭竄改。</p></div>
  <div class="bar"><button class="btn ghost" data-a="download">下載 PDF</button><button class="btn primary wide" data-a="home">返回清單</button></div>`; }
async function download(d) {
  let bytes = pdfStore[d.id]; if (!bytes) { bytes = await generateFinalPdf(d); pdfStore[d.id] = bytes; }
  const h = await sha256(bytes); if (h !== d.pdfHash) { d.pdfHash = h; save(); }   // 不同瀏覽器字型渲染可能不同，以重新產生為準
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([bytes],{type:'application/pdf'})); a.download = `${d.docNumber}.pdf`; a.click(); audit(d,'DOWNLOAD_PDF');
}
/* 稽核 */
function AUDIT() { return hdr('稽核紀錄', null, true) + `<div class="body"><h1>事件（${S.audit.length}）</h1>
  ${S.docs.filter(d=>d.docNumber).map(d=>`<div class="card"><dl class="kv"><dt>${esc(tplOf(d).name)}</dt><dd>${d.docNumber} · ${statusLabel[d.status]}</dd><dt>Document Hash</dt><dd class="hash">${d.documentHash||'-'}</dd><dt>PDF Hash</dt><dd class="hash">${d.pdfHash||'-'}</dd><dt>Signature Hash</dt><dd class="hash">${d.signature?.hash||'-'}</dd></dl></div>`).join('')||'<p class="muted">尚無已簽署文件。</p>'}
  ${[...S.audit].reverse().map(e=>`<div class="log"><span class="muted">${e.t.replace('T',' ').slice(0,19)}</span><span>${esc(e.action)} <span class="muted">${esc(e.doc||'')}</span></span></div>`).join('')}</div>`; }
/* 設定 / 匯入 */
function SETTINGS() { return hdr('設定／匯入範本', null, true) + `<div class="body"><h1>設定</h1>
  <div class="field"><label>甲方（公司）名稱，用於示範合約版面</label><input class="input" id="party" value="${esc(PARTY)}"></div>
  <h2>合約 PDF</h2><p class="small muted">內建整份合約（派遣工作單 p1–2、安全衛生確認單 p3–4、個資同意書 p5）與對應座標。若合約改版，匯入新版整份 PDF；版面若有變動請同步調整 TEMPLATES 的 pdfMapping。${S.customPdf.__master?'<span class="tag done">已匯入自訂版本</span>':''}</p>
  <div class="field"><label>整份合約 PDF（5 頁）</label><input type="file" accept="application/pdf" data-tpl="__master" class="input"></div>
  <p class="small muted">或針對單一文件匯入獨立 PDF：</p>
  ${Object.values(TEMPLATES).map(t=>`<div class="field"><label>${esc(t.name)} ${S.customPdf[t.templateId]?'<span class="tag done">已匯入</span>':''}</label><input type="file" accept="application/pdf" data-tpl="${t.templateId}" class="input"></div>`).join('')}
  <h2>PDF 文字模式</h2><p class="small muted">預設以瀏覽器字型把文字畫成圖，不需安裝任何字型（無法選取／搜尋）。若要 PDF 內為真正文字，可上傳一個 .ttf／.otf 中文字型檔（如思源黑體 TC）。${S.fontName?`目前：<b>${esc(S.fontName)}</b>`:''}</p>
  <input type="file" accept=".ttf,.otf" id="fontfile" class="input">
  <h2>示範資料</h2><button class="btn ghost" data-a="reset">重置所有資料（回到示範初始狀態）</button></div>
  <div class="bar"><button class="btn primary wide" data-a="settings-save">儲存設定</button></div>`; }

/* ---------------- 事件 ---------------- */
app.addEventListener('click', async e => {
  const el = e.target.closest('[data-a]'); if (!el) return; const a = el.dataset.a, d = route.doc;
  if (a==='back') { const prev = {S2:'S1',S3:'S2',S4:()=>basicOk(d)?'S2':'S3',S5:'S4',S7:'S5',S8:'S7',SETTINGS:'S1',AUDIT:'S1'}[route.name]||'S1'; const to = typeof prev==='function'?prev():prev; go(to==='S1'?{name:'S1'}:{name:to,doc:d}); }
  else if (a==='home') go({name:'S1'});
  else if (a==='settings') go({name:'SETTINGS'});
  else if (a==='audit') go({name:'AUDIT'});
  else if (a==='open' || a==='resume') { const doc = S.docs.find(x=>x.id===el.dataset.id); if (doc.status==='Assigned') { doc.status='Opened'; save(); audit(doc,'STATE_OPENED'); }
    if (doc.status==='Completed') { pdfStore[doc.id] || generateFinalPdf(doc).then(b=>pdfStore[doc.id]=b); go({name:'S9',doc}); }
    else if (a==='resume' && doc.lastScreen) { audit(doc,'RESUME_DRAFT',{lastScreen:doc.lastScreen}); go({name:doc.lastScreen, doc}); } else go({name:'S2', doc}); }
  else if (a==='go') go({name:el.dataset.to, doc:d});
  else if (a==='review') { if (!basicOk(d)) return showToast('基本資料尚未完成'); if (['Opened','BasicInfoCompleted'].includes(d.status)) { d.status = checklist(d).canProceed?'FieldsCompleted':'DocumentReviewed'; save(); audit(d,'STATE_DOCUMENTREVIEWED',{pagesViewed:[...route.viewed]}); } go({name:'S5',doc:d}); }
  else if (a==='tab') { route.tab = el.dataset.tab; render(); }
  else if (a==='ov') { const f = tplOf(d).fields.find(x=>x.fieldId===el.dataset.f); if (f.type==='Signature') return; if (f.editable===false||f.type==='Readonly'||f.type==='SystemField') return showToast(f.fillerRole?`此欄位由「${f.fillerRole==='Trainer'?'講師／訓練單位':'主管／人資'}」填寫，您無法修改`:'此欄位由系統或其他資料帶入，不需填寫'); sheet = {fieldId:f.fieldId, value: values(d)[f.fieldId]}; render(); }
  else if (a==='sheet-close') { if (el.classList.contains('scrim') && e.target!==el) return; sheet=null; render(); }
  else if (a==='sheet-commit') { const err = setValue(d, sheet.fieldId, sheet.value); if (err) { sheet.error = err; render(); return; } audit(d,'FIELDS_UPDATED',{field:sheet.fieldId}); sheet=null; route.note='已儲存'; render(); setTimeout(()=>{route.note='';},1500); }
  else if (a==='pick') { if (!sheet) return;
    if (el.dataset.radio!=null) sheet.value = el.dataset.radio;
    else if (el.dataset.cg!=null) { const arr = Array.isArray(sheet.value)?[...sheet.value]:[]; const i = arr.indexOf(el.dataset.cg); i>=0?arr.splice(i,1):arr.push(el.dataset.cg); sheet.value = arr; }
    else if (el.dataset.cb) sheet.value = !sheet.value;
    sheet.error = null; render(); }
  else if (a==='sig-reuse') { route.sig.reuse = S.sessionSig; render(); }
  else if (a==='sig-unreuse') { route.sig.reuse = null; render(); }
  else if (a==='sig-clear') { route.sig.inked=false; padCanvas=null; render(); }
  else if (a==='sig-consent') { route.sig.consent = !route.sig.consent; render(); }
  else if (a==='sig-submit') submitSignature(d);
  else if (a==='download') download(d);
  else if (a==='reset') { if (confirm('確定重置所有示範資料？')) { localStorage.removeItem(KEY); S = seed(); go({name:'S1'}); } }
  else if (a==='settings-save') { localStorage.setItem('esign.party', $('#party').value); location.reload(); }
});
// 直接在畫面上的欄位（S3）與 sheet 內的 input：即時驗證＋自動儲存
app.addEventListener('input', e => {
  const el = e.target, fid = el.dataset.f; if (!fid) return;
  let val = el.value; if (el.tagName==='SELECT') val = el.value;
  if (fid && sheet && el.closest('#sheet-editor')) { sheet.value = val; return; }
  if (route.name==='S3') {   // 邊打邊驗證但不重繪整頁（重繪會把輸入中的字吃掉）
    route.draft = {...(route.draft||{}), [fid]:val};
    const err = setValue(route.doc, fid, val); route.errs = {...(route.errs||{}), [fid]:err};
    const wrap = el.closest('.field'); el.classList.toggle('bad', !!err);
    let msg = wrap.querySelector('.err, .help'); const f = tplOf(route.doc).fields.find(x=>x.fieldId===fid);
    if (err) { if (!msg) { msg = document.createElement('div'); wrap.appendChild(msg); } msg.className='err'; msg.textContent = err; }
    else if (msg) { if (f.helpText) { msg.className='help'; msg.textContent=f.helpText; } else msg.remove(); }
    const next = $('.bar .btn.primary'); if (next) next.disabled = !(basicOk(route.doc) && !Object.values(route.errs).some(Boolean));
    const note = $('.bar .note'); if (note) note.textContent = err ? '' : '已儲存'; }
});
app.addEventListener('change', async e => {
  const el = e.target; if (el.type!=='file' || !el.files[0]) return;
  const buf = new Uint8Array(await el.files[0].arrayBuffer()); let b64=''; for (let i=0;i<buf.length;i+=0x8000) b64 += String.fromCharCode.apply(null, buf.subarray(i,i+0x8000)); b64 = btoa(b64);
  if (el.id==='fontfile') { S.fontBytes = b64; S.fontName = el.files[0].name; save(); showToast('字型已載入，之後產出的 PDF 會內嵌真正文字'); }
  else if (el.dataset.tpl) { S.customPdf[el.dataset.tpl] = b64; Object.keys(blankCache).forEach(k=>delete blankCache[k]); save(); showToast('合約 PDF 已匯入，請確認 pdfMapping 座標'); }
});
render();
</script>
</body>
</html>
